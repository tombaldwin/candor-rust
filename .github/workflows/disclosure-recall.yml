# DISCLOSURE-RECALL calibration for the syscall oracle — is realworld-oracle.yml able to FAIL?
#
# realworld-oracle.yml going green means "no silent under-report was found". That is only evidence about
# candor if the oracle could have found one; a marker that stops firing, a report path that stops
# resolving, or a verdict loosened during a refactor would each turn it into a permanent, silent green that
# looks exactly like soundness. This job seeds the defect the oracle exists to catch and requires red.
#
# Cost: three full passes of the oracle, so it does not run on every PR. It runs when the oracle itself
# changes (the only edits that can break its sensitivity), weekly as an early warning, and on demand.
name: disclosure-recall
on:
  push:
    branches: [main]
    paths: ['soundness/realworld/**', '.github/workflows/disclosure-recall.yml']
  pull_request:
    paths: ['soundness/realworld/**', '.github/workflows/disclosure-recall.yml']
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: disclosure-recall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install strace
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: Disclosure-recall battery (seed a false all-clear; the oracle must catch it)
        run: bash soundness/realworld/recall/disclosure_recall.sh
