name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # ⟨0.30⟩ A DEADLINE. Two SIBLING workflows hung for 3h45m with no output on 2026-08-19 and
    # were given one; this file was not, and then hung for 54 minutes against an ~11-minute
    # normal runtime. With no `timeout-minutes` GitHub's 6-hour default applies, so a stuck
    # runner blocks the release gate (preflight [10] reads CI green on HEAD) while looking
    # exactly like a slow job. Fixing the two that had failed and not their siblings is the
    # habit this repo keeps measuring.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      # Stable toolchain for building the dylint runner. The lint itself builds with
      # the nightly pinned in `rust-toolchain`, which rustup fetches automatically
      # (including the rustc-dev component) when cargo runs in this repo.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-candor-v2-${{ hashFiles('Cargo.lock') }}

      - name: Install dylint
        # +stable: build the runner with stable, not the nightly pinned for the lint.
        # PINNED to the exact versions matching Cargo.toml's dylint_linting (6.0.1): an unpinned
        # install lets a runner major bump land mid-arc and change behavior under CI's feet —
        # bump deliberately, together with the dylint_linting dependency.
        run: |
          cargo +stable install cargo-dylint --version 6.0.1
          cargo +stable install dylint-link --version 6.0.1

      # --workspace so the no-rustc_private crates build too: candor-query is a member but NOT a
      # dependency of the lint, so a bare `cargo build` would never compile it.
      - name: Build lint + tooling crates
        run: cargo build --workspace

      # Lint gate (stable clippy, warnings = errors) on the four stable crates — the scanner/query/
      # classifier/report surface the adopter actually builds. Scoped with -p (not --workspace) so the
      # rustc_private dylint lib, which stable clippy can't compile, stays out. rustfmt is deliberately
      # NOT gated: this code is hand-aligned (annotated comment columns, intentional breaks) and a blind
      # reformat would churn thousands of cosmetic lines; clippy catches the anti-patterns that matter.
      - name: Clippy (stable, -D warnings)
        # +stable explicitly, so this leg keeps testing the toolchain an ADOPTER uses even now that the
        # pinned nightly carries clippy too (the two clippy versions differ and catch different things).
        run: cargo +stable clippy -p candor-report -p candor-query -p candor-classify -p candor-scan --all-targets -- -D warnings

      # The other half of the lint surface: the rustc_private dylint lib and the root `build.rs`, neither
      # of which the stable leg can see (stable clippy can't compile rustc_private, and build.rs belongs
      # to the root package the -p list excludes). Runs on the PINNED nightly, which now carries the
      # clippy component (rust-toolchain) so the bare command resolves. A nightly bump that adds a lint
      # surfaces here — that is the point of gating it rather than qualifying every "clippy clean" claim.
      - name: Clippy (pinned nightly, whole workspace, -D warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (unit + smoke)
        run: cargo test --workspace

      # SPEC §3.1 ⟨0.24⟩'s ACCEPTANCE TEST for `gate --report`, and it is BYTE-LEVEL: the verdict the
      # verb writes over a report MUST be byte-equal to the one `candor-scan --policy` wrote while
      # producing it. It needs BOTH binaries, so it cannot live in `cargo test` (`CARGO_BIN_EXE_*` is
      # set only for bins of the test's own package). A divergence here is a finding about the GATE —
      # exactly the defect class the verb exists to make localisable.
      - name: Gate equivalence (scan --policy ≡ gate --report, byte-level)
        run: bash ci/gate-equivalence.sh

      # Behavioural check: the stateful core (audit + propagation) has no unit test
      # (it needs the dylint harness), so assert real output here — this also catches a
      # regression that makes candor emit nothing at all.
      - name: Behavioural audit check
        run: |
          LIB=$(ls "$PWD"/target/debug/libcandor@*.so)   # absolute: we cd into sample/
          out=$(cd sample && cargo dylint --lib-path "$LIB" 2>&1)
          echo "$out"
          echo "$out" | grep -q '`read_config` effects: { Fs }' \
            || { echo "::error::audit output regressed (expected read_config -> Fs)"; exit 1; }

      # The STABLE backend, proven with NO nightly: candor-scan is built and run with +stable only,
      # and must reproduce the same headline result the nightly lint gives on sample/ (read_config -> Fs).
      # This is the zero-friction adoption path — if it ever needs the nightly, this step catches it.
      - name: Stable scanner (no-nightly backend)
        run: |
          cargo +stable build -p candor-scan
          out=$(./target/debug/candor-scan sample --json)
          echo "$out"
          echo "$out" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert any("read_config" in f["fn"] and "Fs" in f["inferred"] for f in d["functions"]), "stable scanner did not find read_config -> Fs"; assert d["candor"]["toolchain"]=="stable"'

      # End-to-end coverage the in-process unit/ui tests can't reach: the AS-EFF mode
      # diagnostics (env-driven) and cross-crate propagation across a real lib+bin build.
      - name: Integration tests (AS-EFF modes + cross-crate)
        run: bash tests/integration.sh

      # The wrapper is plain bash with no unit tests and has shipped real fail-open bugs. This lane
      # drives EVERY cargo-candor subcommand on a tiny fixture and pins the exit-code contract — the
      # fail-closed negatives especially (policy on a build-broken crate → 2; guard with no baseline
      # → 2; bare/unusable .candor/config → 2; --gate-json verdict emission on policy AND guard).
      - name: Wrapper smoke (every subcommand + fail-closed negatives)
        run: bash ci/wrapper-smoke.sh

      # The shell completions (bash + zsh) are plain script whose dynamic arm derives function names and
      # per-function effects from the discovered report. Assert the static surface AND the context-aware
      # `path <fn> <TAB>` effect completion, so a completion regression can't ship silently. (zsh is
      # installed to exercise its lane; the test skips it gracefully if absent.)
      - name: Shell completion contract
        run: |
          sudo apt-get install -y -qq zsh >/dev/null 2>&1 || true
          bash completions/test.sh

      # Workspace-scale enforcement: AS-EFF-008 host allowlist catching a forbidden endpoint that
      # lives in a SIBLING crate (the cross-crate host-propagation + CANDOR_REPORTS path). Teeth:
      # the verify script also confirms the violation is missed without cross-crate resolution.
      - name: Host-allowlist cross-crate enforcement
        run: bash eval/bet3/verify.sh

      # Cross-crate layering: AS-EFF-009 `forbid <A> -> <B>` catching a dependency on a SIBLING crate.
      - name: Cross-crate layering enforcement
        run: bash eval/bet3/verify-layering.sh

      # Layering through a THIRD crate (app -> util -> infra): the workspace gate's layerreach sidecars
      # follow the laundered dependency.
      - name: Laundered (third-crate) layering enforcement
        run: bash eval/bet3/verify-laundered.sh

      # The Claude Code receipt is plain bash (no Rust test reaches it) and has shipped real
      # bugs (the sidecar/report glob collision). Guard its coverage/freshness/count logic.
      - name: Receipt logic tests (Claude Code integration)
        run: bash integrations/claude-code/test-receipt.sh

      # Dogfood: candor guards its OWN effect surface against regressions.
      # If candor starts performing a new effect, this fails until .candor/baseline
      # is refreshed deliberately (`cargo candor snapshot .candor/baseline`).
      - name: Self-guard
        run: |
          LIB=$(ls "$PWD"/target/debug/libcandor@*.so)
          # Capture output AND exit code without letting `bash -e` abort on a non-zero dylint exit —
          # otherwise the lint's actual output (incl. the AS-EFF-005 detail) is never printed and the
          # step fails opaquely before the grep. Always echo the output + the exit code, THEN classify.
          rc=0
          out=$(CANDOR_BASELINE=.candor/baseline cargo dylint --lib-path "$LIB" 2>&1) || rc=$?
          echo "$out"
          echo "── cargo dylint exit code: $rc ──"
          if echo "$out" | grep -q "AS-EFF-005"; then
            echo "::error::candor's effect surface grew vs .candor/baseline; refresh it if intended"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::cargo dylint exited $rc without emitting AS-EFF-005 — see output above (not a surface regression)"
            exit 1
          fi

      # SELF-GATE (candor-spec §7.12): candor analyzes ITSELF with the STABLE scanner (the adopter's
      # path) and holds its own declared `deny Net Db Exec Ipc` boundary from .candor/policy. An
      # effect-gate vendor whose own gate is red has no business gating anyone else. (Complements the
      # nightly Self-guard above, which is a baseline-drift check, not a policy assertion.)
      - name: Self-gate (candor on candor)
        run: bash ci/self-gate.sh

      # Adversarial SOUNDNESS check: generate crates that thread a known effect through every call
      # form known to produce silent under-reports (closures, dyn dispatch, generic/boxed callbacks,
      # the receiving side), and assert candor never reports a reachable function PURE (effect or
      # Unknown only). This turns "never silently under-reports" from a hope into a gate — it catches
      # the exact class of bug a hand review found one-at-a-time.
      - name: Soundness fuzzer
        run: bash soundness/run.sh 60

      # Operator-overload variant: thread the effect through OVERLOADED operators (`a + b`, `v[i]`,
      # `*p`) whose `Add`/`Index`/`Deref` impls perform the I/O. In HIR these are `Binary`/`Index`/
      # `Unary` nodes, NOT Call/MethodCall — so resolve_callee must devirtualize them or the edge is
      # invisible and the caller looks pure. Teeth-verified: reverting the operator arm fails every seed.
      - name: Soundness fuzzer (operators)
        run: CANDOR_FUZZ_FORMS="op_add index deref" bash soundness/run.sh 40

      # `?` error-conversion variant: the effect is reached through a custom `From<Ea> for Eb` impl
      # invoked by the `?` desugar's error path. candor sees the std `from_residual` call but not the
      # LOCAL `From::from` it dispatches to — the edge must be recovered from the residual/Self types.
      # Teeth-verified: disabling from_residual_local_edge fails every seed.
      - name: Soundness fuzzer (try/from)
        run: CANDOR_FUZZ_FORMS="try_from" bash soundness/run.sh 40

      # `.await` variant: the effect is reached through a custom `Future` whose `poll` performs the I/O,
      # driven by a `.await`. `Fut.await` desugars to a `Future::poll(..)` Call — a non-local trait
      # method dispatched statically to the LOCAL impl, which candor must devirtualize THROUGH the Call.
      # Construction-only (the future is never executor-driven), so it has its own lane, not the oracle.
      # Teeth-verified: disabling Call devirtualization fails every seed.
      - name: Soundness fuzzer (await)
        run: CANDOR_FUZZ_FORMS="await_poll" bash soundness/run.sh 40

      # UFCS dynamic-dispatch variant: `Trait::method(obj)` on a `&dyn Trait` is a Call (not a
      # MethodCall), so the structural `is_dyn_receiver` check never runs; resolution yields a VIRTUAL
      # instance whose `def_id()` is the bodyless trait method. candor must report that as still-virtual
      # (→ CHA the local impls) instead of edging to the bodyless method. Teeth-verified.
      - name: Soundness fuzzer (ufcs-dyn)
        run: CANDOR_FUZZ_FORMS="ufcs_dyn" bash soundness/run.sh 40

      # Iterator-combinator variant: the effect is in a custom `Iterator::next`, consumed through a std
      # COMBINATOR/consumer (`.for_each`, `.map(..).collect()`, `.sum()`, `for x in it.map(..)`). candor
      # resolves the outer call to the std method (pure for itself) and can't follow std's hidden `next()`
      # callback to the local impl — so it must recover the edge to that local `next()` (HOLE 1) or the
      # consumer looks silently pure. (Bare `for`/`while let` desugar `next()` into the consumer's own HIR
      # and are already sound — a separate, unregressed path.) Teeth-verified: reverting fails every seed.
      - name: Soundness fuzzer (iterator combinators)
        run: CANDOR_FUZZ_FORMS="iter_combinator" bash soundness/run.sh 40

      # fmt variant: the effect is in a LOCAL `Display::fmt` reached via a `core::fmt` macro
      # (`format!`/`println!`) — candor sees the std `Argument::new_display`, never the local `fmt` call,
      # so the caller looks silently pure (HOLE 2). candor must edge from the `Argument::new_<kind>`
      # constructor to the value's local fmt impl. Teeth-verified: reverting fails every seed.
      - name: Soundness fuzzer (fmt)
        run: CANDOR_FUZZ_FORMS="display_fmt" bash soundness/run.sh 40

      # Generic-receiver variant: the effect is in a custom `Iterator::next` consumed by a GENERIC
      # consumer `fn gicons<I: Iterator>(it: I) { it.for_each(..) }` called at a CONCRETE site. Inside the
      # consumer `I` is an unresolved `Param`, so candor reported it pure for itself AND lost the effect at
      # the call site (the silent-pure generic-iterator hole). candor must recover the call-site substs
      # (`I=Gi`) and resolve the consumer's internal `<I as Iterator>::next` to the LOCAL impl — the
      # CALLING fn gets the precise effect, the generic consumer an honest report-only `Unknown`. A pure
      # std/custom iterator must NOT gain an effect (no fabrication). Teeth-verified: reverting fails.
      - name: Soundness fuzzer (generic iterator)
        run: CANDOR_FUZZ_FORMS="generic_iter" bash soundness/run.sh 40

      # Cross-crate variant: the chain crosses a lib→bin boundary, exercising candor's DefPathHash
      # cross-crate propagation (its own bug-prone surface the single-crate fuzzer can't reach).
      - name: Soundness fuzzer (cross-crate)
        run: bash soundness/run_cross.sh 40

      # Drop variant: thread the effect through a `Guard`'s `Drop` and wrap the guard in random
      # container forms (direct / field / tuple / array / Option / Box / Vec / Rc / Arc / HashMap /
      # nested). Gates the implicit-Drop edge handling the Bet 4 spike added — including the heap
      # owning-container cases (Vec<Guard>/Box<Guard>) that field-recursion alone would miss.
      - name: Soundness fuzzer (drop)
        run: bash soundness/run_drop.sh 40

      # Dynamic oracle (phase 2): RUN each generated program under strace and assert candor's static
      # prediction over-approximates the effects the kernel actually observed — ground truth that
      # trusts nothing about how the crate was generated. Catches a program that demonstrably performs
      # an effect candor predicts nowhere.
      - name: Install strace
        run: sudo apt-get update -qq && sudo apt-get install -y -qq strace
      - name: Soundness dynamic oracle
        run: bash soundness/oracle.sh 40
      # Per-function oracle: instrument the chain with eprintln entry/exit markers, reconstruct the call
      # STACK at each effect syscall from the interleaved trace, and assert every on-stack function is
      # effect-or-Unknown — attributing a runtime-proven effect to the exact function, not just `main`.
      - name: Soundness per-function oracle
        run: bash soundness/oracle_pf.sh 40

  # The stable crates on macOS — cheap cross-OS coverage for the surface adopters `cargo install`
  # (scan/query/report/classify only; the dylint lint + soundness lanes stay Linux-only — the pinned
  # nightly build is expensive and OS-independent in what it checks).
  stable-crates-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-candor-stable-v1-${{ hashFiles('Cargo.lock') }}
      - name: Test the stable crates (no nightly, no dylint)
        # RUSTFLAGS= (set-but-empty) overrides the workspace .cargo/config.toml's
        # `-C linker=dylint-link` rustflags — this lane deliberately has no dylint toolchain, and the
        # stable crates need no special linker. (The ubuntu job installs dylint-link, so it is
        # unaffected; conformance CI builds from OUTSIDE the repo dir, so the config never applied there.)
        run: RUSTFLAGS= cargo +stable test -p candor-report -p candor-classify -p candor-scan -p candor-query
