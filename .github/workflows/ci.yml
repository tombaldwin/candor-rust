name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stable toolchain for building the dylint runner. The lint itself builds with
      # the nightly pinned in `rust-toolchain`, which rustup fetches automatically
      # (including the rustc-dev component) when cargo runs in this repo.
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-candor-${{ hashFiles('Cargo.lock') }}

      - name: Install dylint
        run: cargo install cargo-dylint dylint-link

      - name: Build lint
        run: cargo build

      - name: Test (unit + smoke)
        run: cargo test

      # Dogfood: candor auditing itself must not ICE and must produce output.
      - name: Self-audit
        run: |
          LIB=$(ls target/debug/libcandor@*.so)
          cargo dylint --lib-path "$LIB"
