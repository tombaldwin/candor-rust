# Real-world DYNAMIC oracle — kernel ground truth on candor-scan's REAL-crate effect classification.
# Runs driver crates (exercising real effectful crates with markers) under strace, confirms the effect
# executed, and asserts candor-scan predicted it or disclosed uncertainty. A silent-pure on a demonstrably
# effectful program is a real under-report (the dangerous direction). Linux + strace only.
# CONTINUOUS GATE (2026-06-18): runs on every push to main + every PR, so a NEW silent under-report on a
# real crate FAILS CI (run.sh exits non-zero on a NEW finding). The strongest soundness evidence we have
# (the only method that catches a SHARED cross-engine blind spot) is now standing, not on-demand.
name: realworld-oracle
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: realworld-oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install strace
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: Real-world dynamic oracle (syscall ground truth — Fs/Net/Exec)
        run: bash soundness/realworld/run.sh
      - name: Non-syscall recall corpus (known-semantics ground truth — Db/Log/Rand/Env/Clock/Ipc/Clipboard)
        # strace can't distinguish these 7 effects; ground truth = the crate's documented semantics.
        # candor-scan is syntactic so this needs no strace/dep-builds. Together with the syscall oracle
        # above, candor's effect classification is now under ground-truth coverage for ALL 10 effects.
        run: bash soundness/realworld/recall/recall.sh
