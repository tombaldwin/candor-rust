# Real-world DYNAMIC oracle — kernel ground truth on candor-scan's REAL-crate effect classification.
# Runs driver crates (exercising real effectful crates with markers) under strace, confirms the effect
# executed, and asserts candor-scan predicted it or disclosed uncertainty. A silent-pure on a demonstrably
# effectful program is a real under-report (the dangerous direction). Linux + strace only; manual for now
# (workflow_dispatch) — it fetches crates.io deps and is a probe, not a per-push gate yet.
name: realworld-oracle
on:
  workflow_dispatch:

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install strace
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: Real-world dynamic oracle
        run: bash soundness/realworld/run.sh
