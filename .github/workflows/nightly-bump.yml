name: nightly-bump

# Automates the rustc-nightly migration that CONTRIBUTING.md describes by hand. candor pins a specific
# nightly (rust-toolchain) because it builds against rustc_private; every so often that nightly should
# move forward. This bot tries the next nightly, runs the full build/test/bless/re-baseline, and — if
# green — opens a PR with the result for review. If the new nightly breaks rustc_private (usually because
# dylint_linting has not released for it yet — dylint lags rustc by weeks, and it gates the deep engine),
# the run stays GREEN with a "candidate not ready" notice and keeps the current pin; a human migrates by
# hand once dylint catches up. This avoids a recurring red-X on a proactive weekly probe that is, by design,
# a few days ahead of dylint. Vendoring clippy_utils removed the old "pick a matching clippy_utils rev" step.
#
# The PR still needs human review: a bump can compile yet shift diagnostics (re-blessed here) or candor's
# own effect surface (re-baselined here) — a reviewer confirms those deltas are benign.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      nightly:
        description: "Target nightly date (YYYY-MM-DD). Empty = a recent date (today − 3 days)."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  bump:
    runs-on: ubuntu-latest
    # ⟨0.30⟩ A DEADLINE. Two SIBLING workflows hung for 3h45m with no output on 2026-08-19 and
    # were given one; this file was not, and then hung for 54 minutes against an ~11-minute
    # normal runtime. With no `timeout-minutes` GitHub's 6-hour default applies, so a stuck
    # runner blocks the release gate (preflight [10] reads CI green on HEAD) while looking
    # exactly like a slow job. Fixing the two that had failed and not their siblings is the
    # habit this repo keeps measuring.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Choose candidate nightly
        id: pick
        run: |
          d="${{ github.event.inputs.nightly }}"
          # Default to a few days back: a same-day nightly may not have rustc-dev mirrored yet.
          [ -n "$d" ] || d="$(date -u -d '3 days ago' +%Y-%m-%d)"
          cur="$(grep -oE 'nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}' rust-toolchain | head -1)"
          echo "candidate=nightly-$d" >> "$GITHUB_OUTPUT"
          echo "current=$cur" >> "$GITHUB_OUTPUT"
          echo "Current pin: $cur → candidate: nightly-$d"
          if [ "nightly-$d" = "$cur" ]; then
            echo "already=1" >> "$GITHUB_OUTPUT"
            echo "Candidate equals the current pin — nothing to do."
          fi

      - name: Pin the candidate nightly
        if: steps.pick.outputs.already != '1'
        run: |
          sed -i -E "s/nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}/${{ steps.pick.outputs.candidate }}/" rust-toolchain
          echo "rust-toolchain now:"; cat rust-toolchain

      # Stable for the dylint runner; the candidate nightly (+rustc-dev) is fetched by rust-toolchain.
      - uses: dtolnay/rust-toolchain@stable
        if: steps.pick.outputs.already != '1'

      - name: Install dylint
        if: steps.pick.outputs.already != '1'
        run: cargo +stable install cargo-dylint dylint-link

      - name: Build (this fetches the candidate nightly + rustc-dev)
        id: build
        if: steps.pick.outputs.already != '1'
        continue-on-error: true   # a candidate that breaks rustc_private is EXPECTED lag, not a repo failure
        run: cargo build --workspace

      # The candidate is typically a few days ahead of what dylint_linting has released for (dylint lags
      # rustc by weeks). When the deep engine can't build on it, that is upstream lag — report it as a
      # green NOTICE and keep the current pin, rather than a recurring red-X on a proactive weekly probe.
      # A SUCCESSFUL build still runs the full suite + opens the bump PR below.
      - name: Candidate not ready — keep the pin, stay green (expected upstream lag)
        if: steps.pick.outputs.already != '1' && steps.build.outcome == 'failure'
        run: |
          echo "::notice title=nightly ${{ steps.pick.outputs.candidate }} not ready::the deep engine does not build on this candidate (rustc_private churn — typically dylint_linting has not released for it yet). Keeping pin ${{ steps.pick.outputs.current }}; re-run when cargo-dylint/dylint_linting catch up."

      - name: Test (unit + ui)
        if: steps.pick.outputs.already != '1' && steps.build.outcome == 'success'
        run: cargo test --workspace

      # A bump can legitimately shift diagnostic rendering — re-bless the ui fixtures from the
      # framework-saved actual output (compiletest has no --bless), exactly as CONTRIBUTING describes.
      - name: Re-bless ui fixtures (if diagnostics shifted)
        if: steps.pick.outputs.already != '1' && steps.build.outcome == 'success'
        run: |
          if ! cargo test --lib ui >/dev/null 2>&1; then
            out="$(cargo test --lib ui 2>&1 || true)"
            for f in ui/*.rs; do
              base="$(basename "$f" .rs)"
              # Anchor on `/<base>.stderr` (a path-segment boundary), NOT a substring — else `base=main`
              # would also match `…/domain.stderr` and cross-bless an unrelated fixture.
              saved="$(printf '%s\n' "$out" | grep -oE "/[^ ]*/${base}\.stderr" | head -1)"
              [ -n "$saved" ] && [ -f "$saved" ] && cp "$saved" "ui/$base.stderr" && echo "blessed ui/$base.stderr"
            done
            cargo test --lib ui # must pass after blessing, else the change is non-trivial → fail
          fi

      # Re-baseline the self-guard: a richer/changed engine can reclassify candor's own effect surface.
      - name: Re-baseline self-guard
        if: steps.pick.outputs.already != '1' && steps.build.outcome == 'success'
        run: |
          LIB="$(ls "$PWD"/target/debug/libcandor@*.so | head -1)"
          CANDOR_JSON=.candor/baseline cargo dylint --lib-path "$LIB" >/dev/null 2>&1 || true
          CANDOR_BASELINE=.candor/baseline cargo dylint --lib-path "$LIB" 2>&1 | grep -q "AS-EFF-005" \
            && { echo "::error::self-guard still trips after re-baseline — investigate"; exit 1; } || true

      - name: Integration + receipt tests
        if: steps.pick.outputs.already != '1' && steps.build.outcome == 'success'
        run: bash tests/integration.sh && bash integrations/claude-code/test-receipt.sh

      - name: Open a PR with the green bump
        if: steps.pick.outputs.already != '1' && steps.build.outcome == 'success'
        uses: peter-evans/create-pull-request@v7
        with:
          # A PR created with the default GITHUB_TOKEN does NOT trigger CI (GitHub's loop-prevention),
          # so the "green bump" PR would arrive with no checks run on the new nightly. Set a repo secret
          # NIGHTLY_BUMP_PAT (a fine-grained PAT with contents+PR write) to get CI on the bot branch;
          # falls back to github.token (PR still opens, just unverified — the bump job's own log stands).
          token: ${{ secrets.NIGHTLY_BUMP_PAT || github.token }}
          branch: bot/nightly-${{ steps.pick.outputs.candidate }}
          title: "Bump pinned nightly to ${{ steps.pick.outputs.candidate }}"
          commit-message: |
            Bump pinned nightly: ${{ steps.pick.outputs.current }} → ${{ steps.pick.outputs.candidate }}

            Automated by .github/workflows/nightly-bump.yml. Build, tests, integration,
            ui (re-blessed if shifted), and the self-guard (re-baselined) all passed on
            the new nightly. Review the re-blessed ui .stderr and the re-baselined
            .candor/ deltas before merging.
          body: |
            Automated nightly bump: `${{ steps.pick.outputs.current }}` → `${{ steps.pick.outputs.candidate }}`.

            The full suite passed on the candidate nightly. This PR may include re-blessed
            `ui/*.stderr` (diagnostic rendering shifted) and a re-baselined `.candor/` (candor's
            own effect surface reclassified). **Please review those deltas** — they should be
            cosmetic/explainable, not a real behavioural change.

            If this PR is absent, the bump failed (the new nightly broke `rustc_private`); see the
            workflow run for the breakage, and migrate by hand per CONTRIBUTING.md.
          labels: automated, nightly-bump

      - name: On failure, open a tracking issue
        if: failure() && steps.pick.outputs.already != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "nightly bump to ${{ steps.pick.outputs.candidate }} failed" \
            --label automated,nightly-bump \
            --body "The automated bump from \`${{ steps.pick.outputs.current }}\` to \`${{ steps.pick.outputs.candidate }}\` failed — the new nightly likely broke \`rustc_private\`. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Migrate by hand per CONTRIBUTING.md." \
            || echo "issue may already exist; skipping"
