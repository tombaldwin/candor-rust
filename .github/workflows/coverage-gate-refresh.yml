# THE STALENESS ANSWER for eval/coverage-gate/{covered,open}.tsv (see generate.py's header for the full
# design). The fast gate (crates/candor-classify/tests/coverage_gate.rs, riding `cargo test --workspace`
# on every push) proves classify.rs hasn't REGRESSED against what the checked-in manifest already knows —
# but it reads a static snapshot of ~74 external crates' PUBLISHED source, so it cannot see a crate
# publishing a new version with a new, uncovered public entry point. That needs a fresh `cargo fetch`
# against live crates.io, which is exactly the "network on every push" cost this family avoids (see
# nightly-bump.yml / disclosure-recall.yml / re-baseline.yml for the same weekly-not-continuous shape).
#
# This job re-runs the SAME generator against FRESH sources and diffs the result against the checked-in
# manifest: a shrinking or unchanged open.tsv and an intact covered.tsv are fine (nothing to do); a new
# uncovered entry crates.io drift introduced, or a covered entry classify() genuinely no longer
# resolves, fails the job and opens a tracking issue with the concrete diff, the same "report a NEW
# finding" contract realworld-oracle.yml already uses.
#
# SOUNDNESS R214: a checked-in covered.tsv row the fresh run no longer sees covered is TWO different
# events, not one — classify() losing a rule (real regression, must fail) vs. the self-scan candidate
# oracle itself no longer nominating the entry because its effect set went empty or non-CORE (e.g. a
# drop-glue over-charge correctly withdrawn — measured instance: `e9cdd23`/R173 on async_nats). The
# comparison itself, and the reasoning for treating those two differently, lives in
# `eval/coverage-gate/generate.py`'s `diff_manifests` (see its module-level R214 comment block) rather
# than here, so this workflow only ever calls it — see that file, not this one, to change the policy.
# The same function also states, in its own output, that the diff has never been proven safe across the
# macOS(checked-in)/Linux(this runner) split (R212) — unresolved, not silently assumed away.
name: coverage-gate-refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 3'  # weekly (Wed 03:41 UTC) — a full re-fetch + 74-crate self-scan, not cheap

permissions:
  issues: write

concurrency:
  group: coverage-gate-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    # SOUNDNESS R157, second half. The job's first-ever green build step (the first fix) moved the failure
    # one layer down: `generate.py` shells out to a BARE `cargo run` for `classify_check`, and that
    # subprocess inherited the repo's `rust-toolchain` (nightly) and `.cargo/config.toml`
    # (`linker=dylint-link`) exactly as the step's own cargo had — "linker `dylint-link` not found" again,
    # after 74 crates fetched and 21,999 entries collected. A per-step `+stable` cannot reach a cargo that
    # Python spawns, so the decision lives here, once, for every step:
    #   RUSTUP_TOOLCHAIN beats the toolchain file (measured: bare `cargo --version` in this repo prints
    #   1.98.0-nightly; with the var, 1.98.0 stable), and a SET-BUT-EMPTY RUSTFLAGS overrides the
    #   workspace linker (the same fact `ci.yml`'s stable lane documents and relies on).
    # Forcing stable is the RIGHT mechanism, not a workaround: `classify_check` depends only on
    # `candor-classify` and serde — no nightly feature, no rustc_private, no dylint. Installing
    # `dylint-link` here would have made it build on a toolchain it never needed.
    env:
      RUSTUP_TOOLCHAIN: stable
      RUSTFLAGS: ""
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      # SOUNDNESS R157. This step ran NIGHTLY, not stable, and had never once succeeded: the repo's
      # `rust-toolchain` file overrides `dtolnay/rust-toolchain@stable` for any bare `cargo`, and
      # `.cargo/config.toml` then forces `linker=dylint-link`, which this job never installs — so every
      # dependency's build script died at link ("linker `dylint-link` not found"), before any fetch or
      # diff. The runner's own log said which toolchain it used; the step's name said otherwise.
      #
      # `ci.yml`'s stable lane documents and escapes both traps with exactly this spelling: `+stable`
      # beats the toolchain file, and set-but-empty RUSTFLAGS overrides the workspace linker. One question
      # ("how do we build on stable in CI") answered twice; the second copy was never checked against
      # the first. It is now the same line.
      - name: Build the stable scanner (the self-scan oracle)
        run: cargo build --release -p candor-scan

      # Both halves of the generator's own test surface, BEFORE the 30-minute fetch-and-scan: the
      # Python extraction tests and classify_check's rendering tests (no row may be lost, every row
      # carries its identity). A generator that fails these produces a manifest whose diff below means
      # nothing, so failing here is strictly cheaper than failing on the diff.
      - name: Coverage-gate generator selftest
        run: python3 eval/coverage-gate/generate.py --selftest

      - name: classify_check unit tests
        run: cargo test --manifest-path eval/coverage-gate/classify_check/Cargo.toml

      - name: Fetch fresh crates.io source for every in-scope calibrated crate
        run: |
          mkdir -p /tmp/coverage-gate-fixture/src
          touch /tmp/coverage-gate-fixture/src/lib.rs
          python3 eval/coverage-gate/generate.py --print-fixture-toml > /tmp/coverage-gate-fixture/Cargo.toml
          cd /tmp/coverage-gate-fixture && cargo fetch

      - name: Regenerate covered.tsv / open.tsv against the fresh fetch
        run: |
          REG=$(ls -d ~/.cargo/registry/src/index.crates.io-* | head -1)
          mkdir -p /tmp/fresh
          cp eval/coverage-gate/generate.py /tmp/fresh-generate.py
          python3 eval/coverage-gate/generate.py --registry "$REG"
          cp eval/coverage-gate/covered.tsv /tmp/fresh/covered.tsv
          cp eval/coverage-gate/open.tsv /tmp/fresh/open.tsv
          # restore the checked-in files so `git diff` below is the ONLY source of truth for what changed
          git checkout -- eval/coverage-gate/covered.tsv eval/coverage-gate/open.tsv

      - name: Diff fresh vs checked-in — fail on regression or growth, report oracle drops separately
        id: diff
        # SOUNDNESS R214. This used to be ~50 lines of `comm`/`cut` reimplementing the comparison in
        # bash — see git history if you need the old spelling. It is now one call into
        # `eval/coverage-gate/generate.py --diff-manifests`, the SAME script that generated both
        # manifests, so there is exactly one place that knows what `entry`, `covered`, and `open` mean
        # (Ask the authority, never reimplement it). It prints a labelled report to this step's own log
        # (regressed / oracle-dropped / newly-uncovered, plus the R212 platform caveat whenever there is
        # anything to report — see that function's docstring for why the split matters and why the
        # platform question stays open) and exits 1 only for `regressed` or `grown`; `oracle_dropped`
        # reaches this step's log as a `::warning::` annotation (visible in the Actions run summary even
        # on an otherwise-green run) and is written to $GITHUB_OUTPUT, but never fails the job by itself.
        run: |
          python3 eval/coverage-gate/generate.py --diff-manifests \
            eval/coverage-gate/covered.tsv /tmp/fresh/covered.tsv \
            eval/coverage-gate/open.tsv /tmp/fresh/open.tsv \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload fresh manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-gate-fresh-manifests
          path: /tmp/fresh/*.tsv
          if-no-files-found: warn

      - name: On drift, open a tracking issue
        if: failure() && steps.diff.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "A fresh \`cargo fetch\` against live crates.io shifted the coverage-gate differential:"
            echo ""
            echo "- **regressed** (classify() no longer resolves this entry, and self-scan STILL nominates it — a real coverage loss): ${{ steps.diff.outputs.regressed }}"
            echo "- **newly uncovered** (crates.io drift introduced a public entry point no rule recognizes): ${{ steps.diff.outputs.grown }}"
            echo ""
            echo "Not counted above and NOT why this issue was filed (SOUNDNESS R214) — reported here only"
            echo "for visibility, since it was also a \`::warning::\` in the job log: ${{ steps.diff.outputs.oracle_dropped }} entries where the self-scan candidate oracle itself stopped nominating the row (its inferred effect set went empty or narrowed to a non-CORE effect — e.g. a drop-glue over-charge correctly withdrawn from the scanner, the async_nats/e9cdd23 instance this distinction was written for). If that count is large, or concentrated entirely in one crate, check the earlier 'self-scan FAILED' log lines before assuming it is benign — it can also mean that crate's self-scan errored out this run."
            echo ""
            echo "**CAVEAT (SOUNDNESS R212, unresolved):** the checked-in manifest and this run's fresh"
            echo "manifest are not proven to be generated on the same platform (checked-in: whatever"
            echo "machine last committed it; this run: the CI runner). The same commit has previously"
            echo "measured a different row count on macOS vs Linux, and the host-platform cause was never"
            echo "ruled out. Reproduce any row below from a same-platform regeneration before treating it"
            echo "as confirmed."
            echo ""
            echo "See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) log for the exact rows, and the uploaded \`coverage-gate-fresh-manifests\` artifact for the full fresh output."
            echo ""
            echo "Regenerate locally (\`python3 eval/coverage-gate/generate.py --print-fixture-toml | ...\`, see that file's USAGE) and either add a classify.rs rule, list a genuinely-pure entry in REVIEWED_PURE_ENTRIES, or fold the new row into open.tsv after triage."
          } > /tmp/issue-body.md
          gh issue create \
            --title "coverage-gate: crates.io drift changed the CALIBRATED_CRATES differential" \
            --label automated,coverage-gate \
            --body-file /tmp/issue-body.md 2>/tmp/issue.err \
            || {
              # SOUNDNESS R159. This was `|| echo "issue may already exist; skipping"` — every failure
              # reason became a green step and a guessed sentence. On the job's first-ever real drift
              # finding (2026-09-02: 39 regressed, 158 newly-uncovered) `gh issue create` failed because
              # neither label existed, the step passed, and the repo had ZERO issues: a finding the job
              # exists to report reached nobody. Only a genuine duplicate is a skip; anything else is the
              # reporting channel being broken, which is a job failure by this family's own ruling
              # (R104, R148: an errored step must not reach the verdict as a pass).
              if grep -qiE "already exists" /tmp/issue.err; then echo "issue already exists; skipping"; else
                echo "::error::gh issue create FAILED — the drift finding above reached nobody:"; cat /tmp/issue.err; exit 1; fi
            }
