[package]
name = "candor-scan"
version = "0.3.0"
edition = "2021"
description = "candor's STABLE-Rust effect scanner — syntactic call-graph + effect report, no nightly."
license = "MIT OR Apache-2.0"

[dependencies]
candor-report = { path = "../candor-report", version = "0.3.0" }
candor-classify = { path = "../candor-classify", version = "0.3.0" }
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = "1"
walkdir = "2"
serde_json = "1"
