[package]
# Scan outputs are never part of the published crate. Four crates shipped `.candor/report.*.json`
# stamped `spec 0.23` inside their 0.25 and 0.26 tarballs — stale self-scans, referenced by nothing,
# and IMMUTABLE once on crates.io. This is the guard, since `git rm` alone only fixes it once.
exclude = [".candor/**"]
name = "candor-scan"
version = "0.34.0"
edition = "2021"
description = "candor's STABLE-Rust effect scanner — syntactic call-graph + effect report, no nightly."
license = "MIT OR Apache-2.0"
authors = ["Tom Baldwin <tom@polymorphism.co.uk>"]
homepage = "https://candor.poly.io"
repository = "https://github.com/tombaldwin/candor-rust"
readme = "README.md"
keywords = ["effects", "capabilities", "static-analysis", "audit", "security"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
candor-report = { path = "../candor-report", version = "0.34.0" }
candor-classify = { path = "../candor-classify", version = "0.34.0" }
# `default-features = false` drops syn's (default-on) `proc-macro` feature, which would otherwise pull
# `proc-macro2/proc-macro` and bake the non-`Send` real `proc_macro::Span` into `syn::File` — making the
# parsed files un-sendable across rayon's worker threads. candor-scan is a standalone BINARY, never a
# proc macro, so that feature is dead weight; everything else syn's default enabled is re-listed verbatim
# (derive/parsing/printing/clone-impls) so parsing behaviour is byte-for-byte unchanged.
syn = { version = "2", default-features = false, features = ["full", "visit", "extra-traits", "derive", "parsing", "printing", "clone-impls"] }
# `span-locations` adds 1-based line / 0-based column tracking to the FALLBACK `Span` (byte offsets stored
# inline + a thread-local source map populated at parse time) — it does NOT pull syn's `proc-macro` feature
# and does NOT make `Span`/`syn::File` any less `Send` than before (the `Rc` in `TokenStream` was already the
# sole `!Send` reason; `SendFile` stays sound). Used to fill each fn's `loc` with `file:line:col` (the spec
# report-schema format). Spans MUST be resolved on the thread that parsed the file — the source map is
# thread-local — which is why loc derivation runs in the rayon parse closures, not single-threaded Pass B.
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
# A REAL TOML parser for the Cargo.toml identity/dependency surface (deps.rs), replacing the hand-rolled
# line scanner that missed two adversarial spellings in one week (workspace-inheritance `{ workspace =
# true }` and dotted-key `log.path = "…"`) — see the module doc on `cargo_toml_deps`/
# `non_registry_manifest_names` for the argument. Already resolved in this workspace's own Cargo.lock
# (a transitive dependency of `dylint_internal`, pulled in by the sibling `candor` lint crate) at
# 1.1.2+spec-1.1.0, so this adds an edge, not a new version to vet.
toml = "1"
# REAL glob matching for `[workspace] members`/`exclude`, replacing the hand-rolled `strip_suffix("/*")`
# special case that only stripped ONE trailing `/*` — so `members = ["crates/*/*"]` (an ordinary,
# non-exotic layout: `cargo metadata` resolves it to real members) looked for a literal directory named
# `crates/*`, found none, and `workspace_members` silently returned zero members with no glob-specific
# disclosure. `glob` is the SAME crate cargo itself resolves `members`/`exclude` patterns through
# (`glob::glob(root.join(pattern))`, one pattern per entry, no special-casing of `*` vs `prefix/*` vs
# `a/*/b`) — see the module doc on `workspace_members` below for the full argument. Tiny, dependency-free,
# and the reference implementation for the exact syntax this field's own semantics are defined by.
glob = "0.3"
