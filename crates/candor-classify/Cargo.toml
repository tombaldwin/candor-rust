[package]
# Scan outputs are never part of the published crate. Four crates shipped `.candor/report.*.json`
# stamped `spec 0.23` inside their 0.25 and 0.26 tarballs — stale self-scans, referenced by nothing,
# and IMMUTABLE once on crates.io. This is the guard, since `git rm` alone only fixes it once.
exclude = [".candor/**"]
name = "candor-classify"
version = "0.33.0"
edition = "2021"
description = "candor's curated effect classifier (crate+path -> effect) — pure, stable Rust."
license = "MIT OR Apache-2.0"
authors = ["Tom Baldwin <tom@polymorphism.co.uk>"]
homepage = "https://candor.poly.io"
repository = "https://github.com/tombaldwin/candor-rust"
readme = "README.md"
keywords = ["candor", "effects", "classifier", "capabilities", "audit"]
categories = ["development-tools"]

[dependencies]
candor-report = { path = "../candor-report", version = "0.33.0" }

# PROPERTY-BASED TESTING, for the one surface the family's generative fuzzers do not reach. Each engine
# already has a soundness fuzzer (candor-rust soundness/, candor-ts fuzz.mjs, candor-agents fuzz.py) and
# every one of them generates CODE and checks EFFECT PROPAGATION. None of them generates a POLICY, and
# the policy parser is where this project's fail-open defects have actually lived — a rule silently
# dropped or silently re-scoped leaves the operator reading a gate that looks armed.
[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
