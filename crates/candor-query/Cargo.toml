[package]
name = "candor-query"
version = "0.5.4"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "candor's read-only report queries (show/where/callers/map/diff) in Rust — used by cargo-candor."
homepage = "https://candor.poly.io"
repository = "https://github.com/tombaldwin/candor-rust"

[[bin]]
name = "candor-query"
path = "src/main.rs"

[dependencies]
candor-report = { path = "../candor-report", version = "0.5.2" }
candor-classify = { path = "../candor-classify", version = "0.5.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
