[package]
# Scan outputs are never part of the published crate. Four crates shipped `.candor/report.*.json`
# stamped `spec 0.23` inside their 0.25 and 0.26 tarballs — stale self-scans, referenced by nothing,
# and IMMUTABLE once on crates.io. This is the guard, since `git rm` alone only fixes it once.
exclude = [".candor/**"]
name = "candor-query"
version = "0.34.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "candor's read-only report queries (show/where/callers/map/diff/containment/…) in Rust — used by cargo-candor."
authors = ["Tom Baldwin <tom@polymorphism.co.uk>"]
homepage = "https://candor.poly.io"
repository = "https://github.com/tombaldwin/candor-rust"
readme = "README.md"
keywords = ["effects", "capabilities", "static-analysis", "audit", "query"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "candor-query"
path = "src/main.rs"

[dependencies]
# Floors, not pins — but candor-report ≥ 0.5.8 is REQUIRED (GateViolation/gate_verdict_json live
# there, and ≥ 0.5.7 is what declares spec 0.8, so resolution can never produce a pre-0.8 spec
# declaration — the same reasoning as candor-scan's floor). Publish order: report first.
candor-report = { path = "../candor-report", version = "0.34.0" }
candor-classify = { path = "../candor-classify", version = "0.34.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
