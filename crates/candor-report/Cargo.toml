[package]
name = "candor-report"
version = "0.21.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Shared candor report types + parsing (no rustc_private) — used by the lint and the CLI."
authors = ["Tom Baldwin <tom@polymorphism.co.uk>"]
homepage = "https://candor.poly.io"
repository = "https://github.com/tombaldwin/candor-rust"
readme = "README.md"
keywords = ["candor", "effects", "report", "audit"]
categories = ["development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
