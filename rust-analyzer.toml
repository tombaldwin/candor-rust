# rust-analyzer config.
#
# WHY: without this, rust-analyzer CRASHES on this repo (measured: "exceeded max crash recovery
# attempts"). The cause is the same structural oddity that makes a root `cargo build --release` build
# the wrong thing — the repo ROOT is a package (`candor`, the dylint lint) that ALSO declares a
# workspace over `crates/*`. The lint is `rustc_private`: it links against rustc internals, which
# rust-analyzer cannot load without a matching toolchain and sysroot, and the failure takes the whole
# server down rather than degrading to "no analysis for that one crate".
#
# `linkedProjects` names the four ENGINE crates explicitly, so the server analyses exactly what anyone
# actually edits and never opens the lint. If you need code intelligence on the lint itself, open it as
# its own project with a nightly toolchain — not from here.
linkedProjects = [
    "crates/candor-report/Cargo.toml",
    "crates/candor-classify/Cargo.toml",
    "crates/candor-scan/Cargo.toml",
    "crates/candor-query/Cargo.toml",
]

# The engines are the only thing worth checking on save here; `--workspace` from the root would drag the
# lint back in through the same door.
[check]
command = "clippy"
