[package]
name = "candor"
version = "0.5.9"
authors = ["Tom Baldwin <tom@polymorphism.co.uk>"]
description = "A type-aware capability/effect checker for Rust, as a dylint lint."
edition = "2024"
license = "MIT OR Apache-2.0"
homepage = "https://candor.poly.io"
repository = "https://github.com/tombaldwin/candor-rust"
readme = "README.md"
keywords = ["lint", "dylint", "effects", "capabilities", "audit"]
categories = ["development-tools"]
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# candor intentionally carries NO git dependencies, so it can be published to crates.io. The single
# clippy_utils helper it used (`span_lint`) is vendored in src/lib.rs. (crates.io still requires the
# pinned nightly + rustc-dev to BUILD this — `rustc_private` — but that's a toolchain requirement,
# not a forbidden dependency.)
dylint_linting = "6.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `version` alongside `path`: cargo builds against the local path here, but a crates.io publish uses
# the version (publish candor-report first). Carrying the version keeps candor publish-ready.
candor-report = { path = "crates/candor-report", version = "0.28.0" }
candor-classify = { path = "crates/candor-classify", version = "0.28.0" }

[dev-dependencies]
dylint_testing = "6.0.1"

[package.metadata.rust-analyzer]
rustc_private = true

# The lint (this crate, a cdylib using rustc_private) plus the no-rustc_private crates that share its
# report types: `candor-report` (the structs) and `candor-query` (the CLI's read-only query logic).
# The in-tree sample/fixture crates are standalone (each its own build target) — exclude them so
# cargo doesn't try to fold them into this workspace.
[workspace]
# ⚠ `cargo build --release` HERE BUILDS THE LINT, NOT THE ENGINES. This file is a PACKAGE (the dylint
# lint above) that also declares a workspace, so a root build never touches `crates/*`. Build them with
# `-p candor-scan` / `-p candor-query`, or from their own directories.
#
# This is not a style note. `target/release/candor-scan` sat eight days stale through a release review,
# and a reviewer measuring it reported a defect that had already been fixed — and, separately, a
# defect that did not exist. If you are about to measure this engine's behaviour, check the binary's
# mtime first.
members = ["crates/candor-report", "crates/candor-query", "crates/candor-classify", "crates/candor-scan"]
# `eval` holds standalone fixture crates (and the scaled-eval harness generates more under it at
# runtime) — exclude the whole subtree so cargo never tries to fold them into this workspace.
exclude = ["sample", "sample-capstd", "eval"]
