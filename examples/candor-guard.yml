# Copy this into YOUR project as .github/workflows/candor-guard.yml
#
# It fails a PR when an existing function GAINS an effect it didn't have in the
# committed baseline (AS-EFF-005) — e.g. a parser that starts opening a socket.
# No capability tokens, no rewrite required.
#
# One-time setup in your repo:
#   1. build candor locally and run:  cargo candor snapshot .candor/baseline
#   2. commit the .candor/ directory.
#   3. refresh the baseline deliberately whenever a new effect is intended.

name: candor guard
on: [pull_request]

jobs:
  candor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dylint
        run: cargo +stable install cargo-dylint dylint-link

      - name: Fetch + build candor
        run: |
          git clone --depth 1 https://github.com/tombaldwin/candor-rust ~/candor
          ( cd ~/candor && cargo build )

      - name: Effect regression guard
        # Fail only on AS-EFF-005 (an existing fn gained an effect) — not on unrelated
        # warnings, which `-D warnings` would also trip on.
        run: |
          LIB=$(ls ~/candor/target/debug/libcandor@*.so)
          out=$(CANDOR_BASELINE=.candor/baseline cargo dylint --lib-path "$LIB" 2>&1)
          echo "$out"
          if echo "$out" | grep -q "AS-EFF-005"; then
            echo "::error::a function gained an effect vs .candor/baseline (refresh if intended)"
            exit 1
          fi
