# Copy this into YOUR project as .github/workflows/candor-guard.yml
#
# It fails a PR when an existing function GAINS an effect it didn't have in the
# committed baseline (AS-EFF-005) — e.g. a parser that starts opening a socket.
# No capability tokens, no rewrite required.
#
# One-time setup in your repo:
#   1. cargo install candor-scan   (pin the version, and install the SAME version in CI below: a baseline
#      recorded by a different scanner build is refused with exit 2, never silently compared)
#   2. record the baseline:        candor-scan . --out .candor/baseline
#   3. commit the .candor/ directory.
#   4. re-record the baseline deliberately whenever a new effect is intended (review `git diff .candor/`).
#
# This is the syntactic FLOOR (candor-scan can miss effects it cannot resolve, and says nothing when it does):
# a green run is necessary, never sufficient.

name: candor guard
on: [pull_request]

jobs:
  candor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install candor-scan
        run: cargo install candor-scan --locked   # add --version <the one that recorded your baseline>

      - name: Effect regression guard
        # Exit 1: an existing fn gained an effect, or a new fn performs one (AS-EFF-005).
        # Exit 2: the guard could not evaluate (unparseable baseline, or one from a different scanner build).
        run: CANDOR_BASELINE=.candor/baseline candor-scan .
